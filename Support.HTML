    <form>
    <fieldset>
        <legend>Support Request</legend>

        <input type="text" name="Fname" placeholder="First Name" required><br><br>
        <input type="text" name="Lname" placeholder="Last Name" required><br><br>
        <input type="email" name="Email" placeholder="Email Address" required><br><br>  
        <input type="tel" name="Phone" placeholder="Phone Number"><br><br>
        <input type="number" name="Age" placeholder="Age" min="1" max="100"><br><br>

        <label>Submission Date:</label>
        <input type="date" name="SubmitDate"><br><br>

        <label>Time of Submission:</label>
        <input type="time" name="SubmitTime"><br><br>

        <label>Upload Screenshot:</label>
        <input type="file" name="Screenshots"><br><br>

        <p>Issue Type:</p>
        <input type="radio" name="Issue" value="technical"> Technical
        <input type="radio" name="Issue" value="billing"> Incorrect Information
        <input type="radio" name="Issue" value="other"> Other
        <br><br>

        <input type="checkbox" name="Updates">Send me support updates<br><br>
        <input type="submit" value="Submit Request">

    </fieldset>
    </form>

    </div>

</body>
